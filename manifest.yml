modules:
  global:fullPage:
    - key: flly-hello-world-global-full-page-custom-ui
      resource: main
      resolver:
        function: resolver
      routePrefix: hello-world
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
    tunnel:
      port: 3000
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/434645b6-7c26-4dab-bd0a-8218f2d4b4fe
  compatibility:
    jira:
      required: true
